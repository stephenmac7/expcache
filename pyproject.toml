[project]
name = "expcache"
version = "0.1.0"
description = "Fingerprint-keyed experiment caching: pickle memoization plus stacked-mmap block storage for arrays"
readme = "README.md"
authors = [
    { name = "Stephen McIntosh", email = "stephenmac7@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "diskcache>=5.6.3",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
